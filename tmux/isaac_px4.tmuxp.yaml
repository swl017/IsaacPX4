session_name: isaac_px4

environment:
  ROS1_INSTALL_PATH: /opt/ros/noetic
  ROS2_INSTALL_PATH: /opt/ros/galactic
  YOLO_INSTALL_PATH: ${HOME}/colcon_ws/install # galactic
  ROS_BRIDGE_INSTALL_PATH: ${HOME}/ros1_bridge_ws/install # galactic
  ROS2_HUMBLE_INSTALL_PATH: ${HOME}/ros2_humble/install # humble
  ROS2_PX4_INSTALL_PATH: ${HOME}/IsaacPX4/ros2_ws/install # humble
  ISAAC_PX4_HOME: ${HOME}/IsaacPX4
  ROS_PARAMETER_EVENT_HANDLER__USE_SIM_TIME: "true" # Use simulation time

options:
  default-command: /bin/bash

windows:
- window_name: simulator
  focus: true
  layout: tiled
  shell_command_before:
    - export DATE=$(date "+%Y-%m-%d_%H-%M-%S"); echo "DATE=$DATE"
    # - source ${ISAAC_PX4_HOME}/env/isaac_px4.sh
  panes:
    - source ${ISAAC_PX4_HOME}/env/isaac_humble.sh; ISAACSIM_PYTHON ${ISAAC_PX4_HOME}/px4_multi_world.isaac.py

- window_name: util
  focus: false
  layout: tiled
  shell_command_before:
    - export DATE=$(date "+%Y-%m-%d_%H-%M-%S"); echo "DATE=$DATE"
    # - source ${ISAAC_PX4_HOME}/env/isaac_px4.sh
  panes:
    - sh ${ISAAC_PX4_HOME}/env/start_uxrce.sh
    - cd ${ISAAC_PX4_HOME}; ./QGroundControl.AppImage

- window_name: ros2
  focus: false
  layout: tiled
  shell_command_before:
    - export DATE=$(date "+%Y-%m-%d_%H-%M-%S"); echo "DATE=$DATE"
    # - source ${ISAAC_PX4_HOME}/env/isaac_px4.sh
  panes:
    - sleep 3; source ${ROS2_HUMBLE_INSTALL_PATH}/setup.bash; source ${ROS2_PX4_INSTALL_PATH}/setup.bash; ros2 launch gimbal_stabilizer multi_agent_gimbal.launch.py
    - sleep 3; source ${ROS2_HUMBLE_INSTALL_PATH}/setup.bash; source ${ROS2_PX4_INSTALL_PATH}/setup.bash; ros2 launch offboard_py offboard.launch.py
    - source ${ROS2_INSTALL_PATH}/setup.bash; ros2 run mavros mavros_node --ros-args --param fcu_url:=udp://:14541@localhost:14551 --param tgt_system:=2 -r __ns:=/px4_1/mavros
    - source ${ROS2_INSTALL_PATH}/setup.bash; ros2 run mavros mavros_node --ros-args --param fcu_url:=udp://:14542@localhost:14552 --param tgt_system:=3 -r __ns:=/px4_2/mavros
    - source ${ROS2_INSTALL_PATH}/setup.bash; ros2 run mavros mavros_node --ros-args --param fcu_url:=udp://:14543@localhost:14553 --param tgt_system:=4 -r __ns:=/px4_3/mavros
    - source ${ROS2_INSTALL_PATH}/setup.bash; ros2 run mavros mavros_node --ros-args --param fcu_url:=udp://:14544@localhost:14554 --param tgt_system:=5 -r __ns:=/px4_4/mavros
    - source ${ROS2_INSTALL_PATH}/setup.bash; ros2 run mavros mavros_node --ros-args --param fcu_url:=udp://:14545@localhost:14555 --param tgt_system:=6 -r __ns:=/px4_5/mavros
    - source ${ROS2_INSTALL_PATH}/setup.bash; ros2 run mavros mavros_node --ros-args --param fcu_url:=udp://:14546@localhost:14556 --param tgt_system:=7 -r __ns:=/px4_6/mavros
    # - sleep 3; source ${YOLO_INSTALL_PATH}/setup.bash; ros2 launch ultralytics_ros tracker_drone.launch.xml ns:=/px4_1
    # - sleep 3; source ${YOLO_INSTALL_PATH}/setup.bash; ros2 launch ultralytics_ros tracker_drone.launch.xml ns:=/px4_2
    # - sleep 3; source ${YOLO_INSTALL_PATH}/setup.bash; ros2 launch ultralytics_ros tracker_drone.launch.xml ns:=/px4_3
    # - sleep 3; source ${ROS2_INSTALL_PATH}/setup.bash; rqt
    - sleep 3; source ${ROS2_INSTALL_PATH}/setup.bash; rviz2 -d /home/usrg/mas/rviz2/multiview.rviz

