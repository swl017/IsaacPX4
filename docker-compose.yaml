# ===========================================================================
#  Run wrapper for the IsaacPX4 full sim-stack image.
#
#  Build:   docker compose build simstack        (or: ./run-simstack.sh --build)
#  Run:     ./run-simstack.sh                     (handles X11, then `compose run`)
#           docker compose run --rm simstack      (raw, if X11 already authorized)
#
#  network_mode: host  -> PX4<->Pegasus MAVLink, ROS2 DDS discovery, and mavros
#                         all work without port plumbing.
#  runtime: nvidia + NVIDIA_DRIVER_CAPABILITIES=all -> RTX viewport rendering
#                         (the `deploy: devices` GPU syntax only grants compute).
# ===========================================================================
services:
  simstack:
    image: isaacpx4-simstack
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - BASE_IMAGE=${BASE_IMAGE:-isaac-lab-ros2}
    container_name: isaacpx4-simstack

    runtime: nvidia
    network_mode: host
    # Override the base image's entrypoint (it starts sshd, which collides with
    # the host sshd under network_mode: host). Plain bash instead.
    entrypoint: /bin/bash
    stdin_open: true
    tty: true

    environment:
      - ACCEPT_EULA=Y
      - PRIVACY_CONSENT=Y
      - OMNI_KIT_ALLOW_ROOT=1
      - ISAACSIM_PATH=/workspace/isaaclab/_isaac_sim
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
      # X11 GUI (DISPLAY is injected from the host by run-simstack.sh)
      - DISPLAY=${DISPLAY:-}
      - QT_X11_NO_MITSHM=1

    volumes:
      # --- X11 GUI ---
      - /tmp/.X11-unix:/tmp/.X11-unix
      - /etc/localtime:/etc/localtime:ro
      # --- Isaac Sim caches: persist shader/asset compilation between runs so
      #     startup is fast after the first launch (named volumes, auto-created) ---
      - simstack-cache-kit:/isaac-sim/kit/cache
      - simstack-cache-ov:/root/.cache/ov
      - simstack-cache-pip:/root/.cache/pip
      - simstack-cache-gl:/root/.cache/nvidia/GLCache
      - simstack-cache-compute:/root/.nv/ComputeCache
      - simstack-logs:/root/.nvidia-omniverse/logs
      - simstack-data:/root/.local/share/ov/data
      - simstack-docs:/root/Documents

      # --- OPTIONAL: Isaac asset pack (the 29 GB we excluded from the image) ---
      #   If your worlds reference a local asset root, extract the assets on the
      #   host and bind-mount them here, then point Isaac's asset root at it.
      # - /path/to/extracted/isaac-sim-assets:/root/isaac-sim-assets:ro

      # --- OPTIONAL: the `mas` ROS2 stack, built inside the container ----------
      #   Its build deps (OpenCV/Boost/GStreamer/tf2/... ) are baked into the image.
      #   Build with:  colcon build --packages-skip ultralytics_ros
      #   (ultralytics_ros needs pcl/rviz2 — blocked by the base's libbrotli pin.)
      # - /home/usrg/source/mas:/home/usrg/mas

      # --- OPTIONAL: live-edit code from the host without rebuilding the image ---
      #   Uncomment to shadow the baked-in copies with your working tree.
      # - ./PegasusSimulator:/home/usrg/IsaacPX4/PegasusSimulator
      # - ./ros2_ws/src/gimbal_stabilizer:/home/usrg/IsaacPX4/ros2_ws/src/gimbal_stabilizer

      # --- OPTIONAL: persist sim/train outputs back to the host ---
      # - ./outputs:/home/usrg/IsaacPX4/outputs

volumes:
  simstack-cache-kit:
  simstack-cache-ov:
  simstack-cache-pip:
  simstack-cache-gl:
  simstack-cache-compute:
  simstack-logs:
  simstack-data:
  simstack-docs:
